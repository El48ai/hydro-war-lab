<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>HYDRO WAR RTS</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#eaf7ff;
  background:#07111f;
  overflow:hidden;
}
#app{
  height:100vh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 20% 0%,rgba(0,255,255,.2),transparent 25%),
    radial-gradient(circle at 90% 20%,rgba(255,50,100,.18),transparent 25%),
    linear-gradient(160deg,#030713,#07182b,#02040a);
}
.topbar{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 10px;
  background:rgba(2,8,18,.88);
  border-bottom:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
}
.logo{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#00eaff55,#8b5cff55);
  border:1px solid #ffffff22;
  font-size:23px;
  box-shadow:0 0 22px #00eaff55;
}
h1{
  margin:0;
  font-size:17px;
  line-height:1.1;
}
.sub{
  color:#9fb8c9;
  font-size:11px;
  margin-top:2px;
}
.stats{
  display:flex;
  gap:7px;
  overflow-x:auto;
  max-width:62vw;
}
.stat{
  white-space:nowrap;
  padding:7px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.14);
  font-size:12px;
}
.main{
  flex:1;
  display:grid;
  grid-template-columns:1fr 330px;
  gap:0;
  min-height:0;
}
.gameWrap{
  position:relative;
  min-width:0;
  min-height:0;
}
#game{
  width:100%;
  height:100%;
  display:block;
  background:#0d2517;
  touch-action:none;
}
.side{
  background:rgba(2,8,18,.9);
  border-left:1px solid rgba(255,255,255,.12);
  padding:10px;
  overflow-y:auto;
}
.panelTitle{
  margin:0 0 8px;
  font-size:16px;
}
.btn{
  width:100%;
  border:0;
  border-radius:14px;
  margin-bottom:8px;
  padding:11px;
  color:white;
  font-weight:800;
  text-align:left;
  background:linear-gradient(135deg,#4d7cff,#8b5cff);
  box-shadow:0 10px 22px rgba(0,0,0,.3);
}
.btn:active{transform:scale(.98)}
.btn small{
  display:block;
  margin-top:4px;
  color:rgba(255,255,255,.72);
  font-weight:400;
  line-height:1.25;
}
.green{background:linear-gradient(135deg,#00c982,#00aaff)}
.red{background:linear-gradient(135deg,#ff335f,#ff9100)}
.dark{background:linear-gradient(135deg,#334155,#111827)}
.log{
  height:155px;
  overflow:auto;
  border-radius:14px;
  padding:8px;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.12);
  color:#d9f8ff;
  font-size:12px;
}
.log div{
  padding:5px 0;
  border-bottom:1px dashed rgba(255,255,255,.1);
}
.tip{
  margin:8px 0;
  padding:9px;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:#bad4e3;
  font-size:12px;
  line-height:1.35;
}
.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%) translateY(16px);
  opacity:0;
  transition:.2s;
  background:#06111f;
  border:1px solid #35f6ff88;
  border-radius:999px;
  padding:11px 15px;
  color:white;
  z-index:50;
  white-space:nowrap;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
.mobileBar{
  display:none;
}
@media(max-width:850px){
  .main{
    grid-template-columns:1fr;
  }
  .side{
    display:none;
  }
  .stats{
    max-width:58vw;
  }
  .mobileBar{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    padding:7px;
    background:rgba(2,8,18,.94);
    border-top:1px solid rgba(255,255,255,.12);
  }
  .mobileBar button{
    border:0;
    border-radius:13px;
    padding:9px 4px;
    color:white;
    background:rgba(255,255,255,.1);
    font-size:11px;
  }
}
</style>
</head>

<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">⚡</div>
      <div>
        <h1>HYDRO WAR RTS</h1>
        <div class="sub">Strategi perang markas sci-fi</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">💰 <b id="money">0</b></div>
      <div class="stat">⚡ <b id="energy">0/0</b></div>
      <div class="stat">👥 <b id="pop">0/0</b></div>
      <div class="stat">🏰 <b id="baseHp">0</b></div>
      <div class="stat">👹 <b id="enemyHp">0</b></div>
    </div>
  </div>

  <div class="main">
    <div class="gameWrap">
      <canvas id="game"></canvas>
    </div>

    <div class="side">
      <h2 class="panelTitle">🎮 Command Center</h2>

      <button class="btn green" onclick="buildUnit('soldier')">🧍 Buat Pasukan
        <small>Murah dan cepat. Cost: 60 uang, 1 energi, 1 populasi.</small>
      </button>

      <button class="btn green" onclick="buildUnit('tank')">🚙 Buat Tank Sci-Fi
        <small>Lebih kuat dan tahan lama. Cost: 160 uang, 2 energi, 2 populasi.</small>
      </button>

      <button class="btn green" onclick="buildUnit('artillery')">🎯 Buat Artileri Fiksi
        <small>Serangan jarak jauh. Cost: 240 uang, 3 energi, 3 populasi.</small>
      </button>

      <button class="btn" onclick="selectAll()">✅ Pilih Semua Unit</button>
      <button class="btn red" onclick="attackEnemyBase()">⚔️ Serang Markas Musuh</button>
      <button class="btn" onclick="centerCamera('home')">🏰 Lihat Markas Kita</button>
      <button class="btn" onclick="centerCamera('enemy')">👹 Lihat Wilayah Musuh</button>
      <button class="btn dark" onclick="saveGame(true)">💾 Simpan</button>
      <button class="btn dark" onclick="resetGame()">🗑️ Reset</button>

      <div class="tip">
        Cara main: tekan unit untuk memilih, lalu tekan tanah untuk menyuruh unit bergerak. Tekan musuh untuk menyerang.
      </div>

      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="mobileBar">
    <button onclick="buildUnit('soldier')">🧍<br>Pasukan</button>
    <button onclick="buildUnit('tank')">🚙<br>Tank</button>
    <button onclick="buildUnit('artillery')">🎯<br>Artileri</button>
    <button onclick="selectAll()">✅<br>Semua</button>
    <button onclick="attackEnemyBase()">⚔️<br>Serang</button>
  </div>
</div>

<div id="toast" class="toast">Info</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WORLD = { w: 1800, h: 1050 };
const SAVE_KEY = "hydro_war_rts_v1";

const unitStats = {
  soldier: {
    name: "Pasukan",
    emoji: "🧍",
    hp: 70,
    dmg: 8,
    range: 85,
    speed: 90,
    cd: .75,
    costMoney: 60,
    energy: 1,
    pop: 1
  },
  tank: {
    name: "Tank Sci-Fi",
    emoji: "🚙",
    hp: 190,
    dmg: 22,
    range: 115,
    speed: 55,
    cd: 1.05,
    costMoney: 160,
    energy: 2,
    pop: 2
  },
  artillery: {
    name: "Artileri Fiksi",
    emoji: "🎯",
    hp: 115,
    dmg: 42,
    range: 230,
    speed: 42,
    cd: 1.7,
    costMoney: 240,
    energy: 3,
    pop: 3
  },
  enemySoldier: {
    name: "Drone Musuh",
    emoji: "👾",
    hp: 82,
    dmg: 9,
    range: 85,
    speed: 73,
    cd: .8,
    energy: 0,
    pop: 0
  },
  enemyTank: {
    name: "Robot Berat",
    emoji: "🤖",
    hp: 170,
    dmg: 20,
    range: 110,
    speed: 50,
    cd: 1.05,
    energy: 0,
    pop: 0
  }
};

let state = loadSave() || {
  money: 420,
  energyCap: 12,
  popCap: 18,
  playerBaseHp: 1200,
  enemyBaseHp: 1400,
  enemyMaxHp: 1400,
  territory: 1
};

let camera = { x: 0, y: 0, zoom: 1 };
let units = [];
let enemies = [];
let projectiles = [];
let selectedIds = [];
let idSeq = 1;
let last = performance.now();
let enemyTimer = 0;
let incomeTimer = 0;

const playerBase = { x: 210, y: 750, w: 150, h: 130 };
const enemyBase = { x: 1450, y: 260, w: 160, h: 145 };

const decor = [];
for(let i=0;i<70;i++){
  decor.push({
    type: Math.random() < .65 ? "tree" : "rock",
    x: 80 + Math.random() * (WORLD.w - 160),
    y: 90 + Math.random() * (WORLD.h - 180),
    s: 10 + Math.random() * 18
  });
}

function resize(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.floor(rect.width));
  canvas.height = Math.max(1, Math.floor(rect.height));
  camera.zoom = Math.max(.55, Math.min(1.05, canvas.width / 950));
  clampCamera();
}
window.addEventListener("resize", resize);

function clampCamera(){
  const vw = canvas.width / camera.zoom;
  const vh = canvas.height / camera.zoom;
  camera.x = Math.max(0, Math.min(WORLD.w - vw, camera.x));
  camera.y = Math.max(0, Math.min(WORLD.h - vh, camera.y));
}

function toast(text){
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(()=>t.classList.remove("show"), 1500);
}

function log(text){
  const box = document.getElementById("log");
  if(!box) return;
  const d = document.createElement("div");
  d.textContent = "• " + text;
  box.prepend(d);
  while(box.children.length > 40) box.removeChild(box.lastChild);
}

function usedEnergy(){
  return units.reduce((a,u)=>a + (unitStats[u.type].energy || 0), 0);
}

function usedPop(){
  return units.reduce((a,u)=>a + (unitStats[u.type].pop || 0), 0);
}

function updateUI(){
  document.getElementById("money").textContent = Math.floor(state.money);
  document.getElementById("energy").textContent = usedEnergy() + "/" + state.energyCap;
  document.getElementById("pop").textContent = usedPop() + "/" + state.popCap;
  document.getElementById("baseHp").textContent = Math.max(0, Math.floor(state.playerBaseHp));
  document.getElementById("enemyHp").textContent = Math.max(0, Math.floor(state.enemyBaseHp));
}

function buildUnit(type){
  const s = unitStats[type];

  if(state.money < s.costMoney){
    toast("Uang kurang");
    return;
  }

  if(usedEnergy() + s.energy > state.energyCap){
    toast("Energi penuh. Butuh pembangkit lagi nanti.");
    return;
  }

  if(usedPop() + s.pop > state.popCap){
    toast("Populasi penuh");
    return;
  }

  state.money -= s.costMoney;

  const spawnX = playerBase.x + playerBase.w + 40 + Math.random() * 30;
  const spawnY = playerBase.y + playerBase.h / 2 + (Math.random() - .5) * 80;

  const unit = makeUnit(type, "player", spawnX, spawnY);
  units.push(unit);
  selectedIds = [unit.id];

  log(s.name + " dibuat di markas.");
  updateUI();
}

function makeUnit(type, team, x, y){
  const s = unitStats[type];

  return {
    id: idSeq++,
    type,
    team,
    x,
    y,
    hp: s.hp,
    maxHp: s.hp,
    targetId: null,
    targetBase: null,
    dest: null,
    cd: 0
  };
}

function spawnEnemy(){
  const heavy = Math.random() < Math.min(.45, state.territory * .05);
  const type = heavy ? "enemyTank" : "enemySoldier";

  const x = enemyBase.x - 40 - Math.random() * 40;
  const y = enemyBase.y + enemyBase.h / 2 + (Math.random() - .5) * 90;

  const e = makeUnit(type, "enemy", x, y);
  e.targetBase = "player";
  enemies.push(e);

  log((heavy ? "Robot berat musuh" : "Drone musuh") + " keluar dari wilayah musuh.");
}

function selectAll(){
  selectedIds = units.map(u=>u.id);
  toast("Semua unit dipilih");
}

function attackEnemyBase(){
  if(units.length === 0){
    toast("Belum ada unit");
    return;
  }

  selectedIds = units.map(u=>u.id);
  for(const u of units){
    u.targetBase = "enemy";
    u.targetId = null;
    u.dest = null;
  }

  toast("Semua unit menyerang markas musuh");
  log("Komandan mengirim semua unit ke wilayah musuh.");
}

function centerCamera(where){
  if(where === "enemy"){
    camera.x = enemyBase.x - canvas.width / camera.zoom / 2;
    camera.y = enemyBase.y - canvas.height / camera.zoom / 2;
  }else{
    camera.x = playerBase.x - canvas.width / camera.zoom / 2;
    camera.y = playerBase.y - canvas.height / camera.zoom / 2;
  }
  clampCamera();
}

function dist(a,b){
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx*dx + dy*dy);
}

function moveToward(u, target, dt){
  const dx = target.x - u.x;
  const dy = target.y - u.y;
  const d = Math.sqrt(dx*dx + dy*dy);

  if(d < 4) return true;

  const s = unitStats[u.type].speed;
  u.x += dx / d * s * dt;
  u.y += dy / d * s * dt;
  return false;
}

function nearestEnemy(u, list, range){
  let best = null;
  let bestD = 999999;

  for(const e of list){
    const d = dist(u,e);
    if(d < bestD && d <= range){
      best = e;
      bestD = d;
    }
  }
  return best;
}

function baseCenter(base){
  return { x: base.x + base.w/2, y: base.y + base.h/2 };
}

function attack(attacker, target){
  const s = unitStats[attacker.type];
  if(attacker.cd > 0) return;

  attacker.cd = s.cd;
  target.hp -= s.dmg;

  projectiles.push({
    x: attacker.x,
    y: attacker.y,
    tx: target.x,
    ty: target.y,
    life: .18,
    team: attacker.team
  });
}

function attackBase(attacker, which){
  const s = unitStats[attacker.type];
  if(attacker.cd > 0) return;

  attacker.cd = s.cd;

  const target = which === "enemy" ? baseCenter(enemyBase) : baseCenter(playerBase);

  projectiles.push({
    x: attacker.x,
    y: attacker.y,
    tx: target.x,
    ty: target.y,
    life: .18,
    team: attacker.team
  });

  if(which === "enemy"){
    state.enemyBaseHp -= s.dmg;
    if(state.enemyBaseHp <= 0) winTerritory();
  }else{
    state.playerBaseHp -= s.dmg;
    if(state.playerBaseHp <= 0) loseGame();
  }
}

function winTerritory(){
  toast("Wilayah musuh direbut!");
  log("Markas musuh hancur. Wilayah baru berhasil direbut.");

  state.territory++;
  state.money += 500 + state.territory * 120;
  state.energyCap += 2;
  state.popCap += 3;
  state.enemyMaxHp = 1400 + state.territory * 420;
  state.enemyBaseHp = state.enemyMaxHp;

  enemies = [];
  projectiles = [];

  centerCamera("home");
  saveGame(false);
}

function loseGame(){
  toast("Markas kamu rusak berat!");
  log("Markas kamu dihancurkan. Sistem memperbaiki sebagian markas.");

  state.playerBaseHp = 500;
  state.money = Math.max(100, state.money - 300);
  units = [];
  enemies = [];
  selectedIds = [];
  projectiles = [];
}

function update(dt){
  incomeTimer += dt;
  enemyTimer += dt;

  if(incomeTimer >= 1){
    incomeTimer = 0;
    state.money += 10 + state.territory * 2;
  }

  const enemyDelay = Math.max(3.5, 7.2 - state.territory * .22);
  if(enemyTimer >= enemyDelay){
    enemyTimer = 0;
    spawnEnemy();
  }

  for(const u of units){
    const s = unitStats[u.type];
    u.cd = Math.max(0, u.cd - dt);

    let target = null;

    if(u.targetId){
      target = enemies.find(e=>e.id === u.targetId);
      if(!target) u.targetId = null;
    }

    if(!target){
      target = nearestEnemy(u, enemies, s.range + 70);
    }

    if(target){
      if(dist(u,target) <= s.range){
        attack(u,target);
      }else{
        moveToward(u,target,dt);
      }
      continue;
    }

    if(u.targetBase === "enemy"){
      const c = baseCenter(enemyBase);
      if(dist(u,c) <= s.range + 30){
        attackBase(u,"enemy");
      }else{
        moveToward(u,c,dt);
      }
      continue;
    }

    if(u.dest){
      const done = moveToward(u,u.dest,dt);
      if(done) u.dest = null;
    }
  }

  for(const e of enemies){
    const s = unitStats[e.type];
    e.cd = Math.max(0, e.cd - dt);

    let target = nearestEnemy(e, units, s.range + 70);

    if(target){
      if(dist(e,target) <= s.range){
        attack(e,target);
      }else{
        moveToward(e,target,dt);
      }
      continue;
    }

    const c = baseCenter(playerBase);
    if(dist(e,c) <= s.range + 25){
      attackBase(e,"player");
    }else{
      moveToward(e,c,dt);
    }
  }

  units = units.filter(u=>u.hp > 0);
  enemies = enemies.filter(e=>e.hp > 0);
  selectedIds = selectedIds.filter(id=>units.some(u=>u.id === id));

  for(const p of projectiles){
    p.life -= dt;
  }
  projectiles = projectiles.filter(p=>p.life > 0);

  updateUI();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.scale(camera.zoom,camera.zoom);
  ctx.translate(-camera.x,-camera.y);

  drawTerrain();
  drawBuildings();
  drawUnits();
  drawProjectiles();

  ctx.restore();

  drawMinimap();
}

function drawTerrain(){
  ctx.fillStyle = "#173c20";
  ctx.fillRect(0,0,WORLD.w,WORLD.h);

  ctx.fillStyle = "#1f4d26";
  for(let x=0;x<WORLD.w;x+=80){
    for(let y=0;y<WORLD.h;y+=80){
      if((x+y)%160===0) ctx.fillRect(x,y,80,80);
    }
  }

  ctx.strokeStyle = "rgba(255,255,255,.06)";
  ctx.lineWidth = 1;
  for(let x=0;x<WORLD.w;x+=80){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,WORLD.h);
    ctx.stroke();
  }
  for(let y=0;y<WORLD.h;y+=80){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(WORLD.w,y);
    ctx.stroke();
  }

  ctx.strokeStyle = "rgba(166,120,57,.45)";
  ctx.lineWidth = 48;
  ctx.beginPath();
  ctx.moveTo(playerBase.x+120, playerBase.y+60);
  ctx.bezierCurveTo(520,700,850,520,enemyBase.x+50,enemyBase.y+80);
  ctx.stroke();

  for(const d of decor){
    if(d.type === "tree"){
      ctx.fillStyle = "#0b2612";
      ctx.beginPath();
      ctx.arc(d.x,d.y,d.s,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#1d6b2e";
      ctx.beginPath();
      ctx.arc(d.x,d.y-4,d.s*.75,0,Math.PI*2);
      ctx.fill();
    }else{
      ctx.fillStyle = "#4a3a25";
      ctx.beginPath();
      ctx.ellipse(d.x,d.y,d.s*1.2,d.s*.7,.2,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#8a7048";
      ctx.beginPath();
      ctx.ellipse(d.x-3,d.y-3,d.s*.6,d.s*.35,.2,0,Math.PI*2);
      ctx.fill();
    }
  }

  ctx.fillStyle = "rgba(0,238,255,.1)";
  ctx.fillRect(0,0,WORLD.w/2,WORLD.h);

  ctx.fillStyle = "rgba(255,60,100,.09)";
  ctx.fillRect(WORLD.w/2,0,WORLD.w/2,WORLD.h);

  ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.font = "24px Arial";
  ctx.fillText("WILAYAH KAMU", 80, 80);
  ctx.fillText("WILAYAH MUSUH", WORLD.w - 330, 80);
}

function drawBuildingRect(base, color, emoji, label, hp, maxHp){
  ctx.fillStyle = color;
  roundRect(base.x,base.y,base.w,base.h,22);
  ctx.fill();

  ctx.strokeStyle = "rgba(255,255,255,.35)";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = "46px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(emoji, base.x + base.w/2, base.y + base.h/2 - 10);

  ctx.font = "16px Arial";
  ctx.fillStyle = "#fff";
  ctx.fillText(label, base.x + base.w/2, base.y + base.h - 24);

  const pct = Math.max(0,hp/maxHp);
  ctx.fillStyle = "rgba(0,0,0,.55)";
  ctx.fillRect(base.x+15,base.y+10,base.w-30,9);
  ctx.fillStyle = label.includes("Musuh") ? "#ff335f" : "#35f6ff";
  ctx.fillRect(base.x+15,base.y+10,(base.w-30)*pct,9);
}

function drawBuildings(){
  drawBuildingRect(playerBase,"#165d8e","🏰","Markas Kamu",state.playerBaseHp,1200);
  drawBuildingRect(enemyBase,"#84243a","👹","Markas Musuh",state.enemyBaseHp,state.enemyMaxHp);

  drawSmallBuilding(230,590,"🏭","Pabrik");
  drawSmallBuilding(110,610,"⚡","Energi");
  drawSmallBuilding(340,790,"🧪","Lab");

  drawSmallBuilding(1320,350,"🏭","Pabrik Musuh",true);
  drawSmallBuilding(1510,450,"📡","Radar Musuh",true);
}

function drawSmallBuilding(x,y,emoji,label,enemy=false){
  ctx.fillStyle = enemy ? "#562030" : "#123e58";
  roundRect(x,y,95,70,16);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.18)";
  ctx.stroke();

  ctx.font = "28px Arial";
  ctx.textAlign = "center";
  ctx.fillText(emoji,x+47,y+32);

  ctx.fillStyle = "#e8f7ff";
  ctx.font = "12px Arial";
  ctx.fillText(label,x+47,y+58);
}

function drawUnits(){
  for(const e of enemies) drawUnit(e);
  for(const u of units) drawUnit(u);
}

function drawUnit(u){
  const s = unitStats[u.type];
  const selected = selectedIds.includes(u.id);

  ctx.save();
  ctx.translate(u.x,u.y);

  if(selected){
    ctx.strokeStyle = "#ffee55";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0,0,30,0,Math.PI*2);
    ctx.stroke();
  }

  ctx.fillStyle = u.team === "player" ? "#154e82" : "#7a1d30";
  ctx.strokeStyle = u.team === "player" ? "#35f6ff" : "#ff335f";
  ctx.lineWidth = 2;
  roundRect(-22,-22,44,44,13);
  ctx.fill();
  ctx.stroke();

  ctx.font = "25px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(s.emoji,0,0);

  ctx.fillStyle = "rgba(0,0,0,.65)";
  ctx.fillRect(-22,-32,44,6);
  ctx.fillStyle = u.team === "player" ? "#18ff9a" : "#ffd166";
  ctx.fillRect(-22,-32,44*Math.max(0,u.hp/u.maxHp),6);

  ctx.restore();
}

function drawProjectiles(){
  for(const p of projectiles){
    ctx.strokeStyle = p.team === "player" ? "#35f6ff" : "#ff335f";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.tx,p.ty);
    ctx.stroke();
  }
}

function drawMinimap(){
  const w = 155;
  const h = 92;
  const x = 12;
  const y = 12;

  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,.55)";
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = "rgba(53,246,255,.7)";
  ctx.strokeRect(x,y,w,h);

  function mx(wx){return x + wx / WORLD.w * w}
  function my(wy){return y + wy / WORLD.h * h}

  ctx.fillStyle = "#35f6ff";
  ctx.fillRect(mx(playerBase.x),my(playerBase.y),10,8);

  ctx.fillStyle = "#ff335f";
  ctx.fillRect(mx(enemyBase.x),my(enemyBase.y),10,8);

  ctx.fillStyle = "#aefcff";
  for(const u of units){
    ctx.fillRect(mx(u.x),my(u.y),3,3);
  }

  ctx.fillStyle = "#ff9b2f";
  for(const e of enemies){
    ctx.fillRect(mx(e.x),my(e.y),3,3);
  }

  const vw = canvas.width / camera.zoom;
  const vh = canvas.height / camera.zoom;
  ctx.strokeStyle = "#fff";
  ctx.strokeRect(mx(camera.x),my(camera.y),vw/WORLD.w*w,vh/WORLD.h*h);

  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function screenToWorld(sx,sy){
  return {
    x: sx / camera.zoom + camera.x,
    y: sy / camera.zoom + camera.y
  };
}

function findUnitAt(pos){
  for(let i=units.length-1;i>=0;i--){
    if(dist(units[i],pos) < 30) return units[i];
  }
  for(let i=enemies.length-1;i>=0;i--){
    if(dist(enemies[i],pos) < 30) return enemies[i];
  }
  return null;
}

function pointInBase(pos,base){
  return pos.x>=base.x && pos.x<=base.x+base.w && pos.y>=base.y && pos.y<=base.y+base.h;
}

let pointer = {
  down:false,
  startX:0,
  startY:0,
  lastX:0,
  lastY:0,
  moved:false
};

canvas.addEventListener("pointerdown", e=>{
  canvas.setPointerCapture(e.pointerId);
  pointer.down = true;
  pointer.startX = e.offsetX;
  pointer.startY = e.offsetY;
  pointer.lastX = e.offsetX;
  pointer.lastY = e.offsetY;
  pointer.moved = false;
});

canvas.addEventListener("pointermove", e=>{
  if(!pointer.down) return;

  const dx = e.offsetX - pointer.lastX;
  const dy = e.offsetY - pointer.lastY;
  const total = Math.hypot(e.offsetX-pointer.startX,e.offsetY-pointer.startY);

  if(total > 8){
    pointer.moved = true;
    camera.x -= dx / camera.zoom;
    camera.y -= dy / camera.zoom;
    clampCamera();
  }

  pointer.lastX = e.offsetX;
  pointer.lastY = e.offsetY;
});

canvas.addEventListener("pointerup", e=>{
  pointer.down = false;

  if(pointer.moved) return;

  const pos = screenToWorld(e.offsetX,e.offsetY);
  handleClick(pos);
});

function handleClick(pos){
  const hit = findUnitAt(pos);

  if(hit){
    if(hit.team === "player"){
      if(selectedIds.includes(hit.id)){
        selectedIds = selectedIds.filter(id=>id!==hit.id);
      }else{
        selectedIds = [hit.id];
      }
      return;
    }

    if(selectedIds.length){
      for(const id of selectedIds){
        const u = units.find(x=>x.id===id);
        if(u){
          u.targetId = hit.id;
          u.targetBase = null;
          u.dest = null;
        }
      }
      toast("Target musuh dikunci");
      return;
    }
  }

  if(pointInBase(pos,enemyBase) && selectedIds.length){
    for(const id of selectedIds){
      const u = units.find(x=>x.id===id);
      if(u){
        u.targetBase = "enemy";
        u.targetId = null;
        u.dest = null;
      }
    }
    toast("Menyerang markas musuh");
    return;
  }

  if(selectedIds.length){
    for(const id of selectedIds){
      const u = units.find(x=>x.id===id);
      if(u){
        u.dest = {
          x: pos.x + (Math.random()-.5)*40,
          y: pos.y + (Math.random()-.5)*40
        };
        u.targetBase = null;
        u.targetId = null;
      }
    }
    toast("Unit bergerak");
  }
}

function gameLoop(now){
  const dt = Math.min(.05,(now-last)/1000);
  last = now;

  update(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

function saveGame(show=false){
  localStorage.setItem(SAVE_KEY,JSON.stringify(state));
  if(show) toast("Game disimpan");
}

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    return null;
  }
}

function resetGame(){
  if(!confirm("Reset game dari awal?")) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

setInterval(()=>saveGame(false),5000);

resize();
centerCamera("home");
updateUI();
log("Game siap. Buat pasukan, pilih unit, lalu tekan tanah atau markas musuh.");
requestAnimationFrame(gameLoop);
</script>
