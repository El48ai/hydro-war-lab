<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#050816" />
<title>HYDRO WAR RTS — Pro Edition</title>

<style>
:root{
  --bg:#050816;
  --panel:rgba(7,14,30,.82);
  --panel2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.14);
  --cyan:#35f6ff;
  --blue:#4d7cff;
  --purple:#9d5cff;
  --green:#19ff9a;
  --yellow:#ffd166;
  --red:#ff3d64;
  --text:#f4fbff;
  --muted:#9db5c8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#050816;
  color:var(--text);
}
body{
  background:
    radial-gradient(circle at 18% -10%,rgba(53,246,255,.25),transparent 32%),
    radial-gradient(circle at 90% 10%,rgba(157,92,255,.22),transparent 30%),
    linear-gradient(145deg,#030512,#07162b 45%,#02040a);
}
#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}
.topbar{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 12px;
  background:rgba(4,8,20,.88);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
  z-index:10;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.logo{
  width:48px;
  height:48px;
  border-radius:18px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(135deg,rgba(53,246,255,.38),rgba(157,92,255,.34)),
    rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 0 32px rgba(53,246,255,.35);
  font-size:25px;
}
.brand h1{
  margin:0;
  font-size:18px;
  line-height:1.1;
  white-space:nowrap;
}
.brand span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
  white-space:nowrap;
}
.hudStats{
  display:flex;
  gap:7px;
  overflow-x:auto;
  max-width:65vw;
  scrollbar-width:none;
}
.hudStats::-webkit-scrollbar{display:none}
.stat{
  padding:8px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  white-space:nowrap;
  font-size:12px;
}
.main{
  flex:1;
  display:grid;
  grid-template-columns:1fr 340px;
  min-height:0;
}
.gameArea{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;
}
#game{
  width:100%;
  height:100%;
  display:block;
  background:#0b1d18;
  touch-action:none;
}
.crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:36px;
  height:36px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(53,246,255,.3);
  border-radius:50%;
  pointer-events:none;
  opacity:.45;
}
.crosshair::before,.crosshair::after{
  content:"";
  position:absolute;
  background:rgba(53,246,255,.5);
}
.crosshair::before{width:14px;height:1px;left:10px;top:17px}
.crosshair::after{width:1px;height:14px;left:17px;top:10px}
.side{
  background:rgba(3,7,18,.92);
  border-left:1px solid var(--line);
  backdrop-filter:blur(18px);
  padding:12px;
  overflow-y:auto;
}
.side h2{
  margin:0 0 10px;
  font-size:17px;
}
.commandCard{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);
  border-radius:22px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 18px 50px rgba(0,0,0,.22);
}
.commandCard b{display:block;margin-bottom:4px}
.commandCard small{
  color:var(--muted);
  line-height:1.35;
}
.btn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:12px;
  margin-bottom:8px;
  color:#fff;
  text-align:left;
  font-weight:800;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  box-shadow:0 14px 30px rgba(0,0,0,.3);
  cursor:pointer;
}
.btn:active{transform:scale(.98)}
.btn small{
  display:block;
  margin-top:4px;
  font-weight:500;
  color:rgba(255,255,255,.72);
  line-height:1.25;
}
.btn.green{background:linear-gradient(135deg,#00bf86,#00aaff)}
.btn.red{background:linear-gradient(135deg,#ff315f,#ff8a00)}
.btn.dark{background:linear-gradient(135deg,#334155,#111827)}
.btn.gold{background:linear-gradient(135deg,#ffb703,#ff4d8d)}
.gridBtns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.gridBtns .btn{
  margin-bottom:0;
  text-align:center;
  padding:11px 6px;
}
.infoLine{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-bottom:1px dashed rgba(255,255,255,.1);
  color:var(--muted);
  font-size:12px;
}
.infoLine strong{color:white}
.bar{
  width:100%;
  height:10px;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  overflow:hidden;
  margin-top:8px;
}
.bar span{
  display:block;
  height:100%;
  width:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--green),var(--cyan));
}
.bar.red span{
  background:linear-gradient(90deg,var(--red),var(--yellow));
}
.log{
  height:152px;
  overflow-y:auto;
  background:rgba(0,0,0,.26);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:9px;
  color:#d8f8ff;
  font-size:12px;
}
.log div{
  padding:5px 0;
  border-bottom:1px dashed rgba(255,255,255,.08);
}
.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  z-index:50;
  transform:translateX(-50%) translateY(18px);
  opacity:0;
  transition:.22s;
  padding:12px 16px;
  border-radius:999px;
  background:rgba(4,8,20,.95);
  border:1px solid rgba(53,246,255,.45);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
  color:white;
  white-space:nowrap;
  font-size:13px;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
.mobileBar{
  display:none;
}
@media(max-width:900px){
  .main{
    grid-template-columns:1fr;
  }
  .side{
    display:none;
  }
  .hudStats{
    max-width:58vw;
  }
  .mobileBar{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
    padding:7px;
    background:rgba(3,7,18,.96);
    border-top:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(16px);
  }
  .mobileBar button{
    border:0;
    border-radius:14px;
    padding:9px 3px;
    background:rgba(255,255,255,.09);
    color:white;
    font-size:10px;
    line-height:1.2;
  }
}
@media(max-width:540px){
  .topbar{
    height:60px;
    padding:7px 9px;
  }
  .logo{
    width:42px;
    height:42px;
    border-radius:15px;
    font-size:22px;
  }
  .brand h1{
    font-size:15px;
  }
  .brand span{
    font-size:10px;
    max-width:135px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .hudStats{
    max-width:50vw;
  }
  .stat{
    padding:7px 8px;
    font-size:11px;
  }
}
</style>
</head>

<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">⚡</div>
      <div>
        <h1>HYDRO WAR RTS</h1>
        <span>Pro Edition • strategi markas sci-fi</span>
      </div>
    </div>

    <div class="hudStats">
      <div class="stat">💰 <b id="money">0</b></div>
      <div class="stat">⚡ <b id="energy">0/0</b></div>
      <div class="stat">👥 <b id="pop">0/0</b></div>
      <div class="stat">🧬 Tech <b id="tech">1</b></div>
      <div class="stat">🌍 Zone <b id="zone">1</b></div>
    </div>
  </header>

  <main class="main">
    <section class="gameArea">
      <canvas id="game"></canvas>
      <div class="crosshair"></div>
    </section>

    <aside class="side">
      <h2>🎮 Command Center</h2>

      <div class="commandCard">
        <b>📡 Status Markas</b>
        <div class="infoLine"><span>HP Markas Kamu</span><strong id="baseHpText">0</strong></div>
        <div class="bar"><span id="baseHpBar"></span></div>
        <div class="infoLine"><span>HP Markas Musuh</span><strong id="enemyHpText">0</strong></div>
        <div class="bar red"><span id="enemyHpBar"></span></div>
      </div>

      <button class="btn green" onclick="buildUnit('soldier')">🧍 Rekrut Pasukan
        <small>Unit cepat dan murah untuk membuka jalan.</small>
      </button>

      <button class="btn green" onclick="buildUnit('tank')">🚙 Produksi Tank Sci-Fi
        <small>Unit kuat, tahan lama, cocok untuk menyerang markas.</small>
      </button>

      <button class="btn green" onclick="buildUnit('drone')">🛰️ Produksi Drone
        <small>Cepat, lincah, bagus untuk menyerang unit musuh.</small>
      </button>

      <button class="btn gold" onclick="buildUnit('artillery')">🎯 Produksi Artileri Fiksi
        <small>Jangkauan jauh dan damage besar.</small>
      </button>

      <div class="gridBtns">
        <button class="btn" onclick="selectAll()">✅ Semua</button>
        <button class="btn red" onclick="attackEnemyBase()">⚔️ Serang</button>
      </div>

      <div style="height:8px"></div>

      <button class="btn" onclick="upgradeTech()">🧬 Upgrade Teknologi
        <small>Menambah energi, populasi, dan kekuatan produksi.</small>
      </button>

      <button class="btn" onclick="repairBase()">🛠️ Perbaiki Markas
        <small>Memulihkan HP markas kamu.</small>
      </button>

      <div class="gridBtns">
        <button class="btn dark" onclick="centerCamera('home')">🏰 Home</button>
        <button class="btn dark" onclick="centerCamera('enemy')">👹 Musuh</button>
      </div>

      <div style="height:8px"></div>

      <div class="gridBtns">
        <button class="btn dark" onclick="saveGame(true)">💾 Save</button>
        <button class="btn dark" onclick="resetGame()">🗑️ Reset</button>
      </div>

      <div class="commandCard">
        <b>💡 Cara Main</b>
        <small>
          Tap unit untuk memilih. Tap tanah untuk bergerak. Tap musuh untuk menyerang.
          Geser layar untuk menggerakkan kamera.
        </small>
      </div>

      <div class="log" id="log"></div>
    </aside>
  </main>

  <nav class="mobileBar">
    <button onclick="buildUnit('soldier')">🧍<br>Pasukan</button>
    <button onclick="buildUnit('tank')">🚙<br>Tank</button>
    <button onclick="buildUnit('drone')">🛰️<br>Drone</button>
    <button onclick="buildUnit('artillery')">🎯<br>Artileri</button>
    <button onclick="selectAll()">✅<br>Semua</button>
    <button onclick="attackEnemyBase()">⚔️<br>Serang</button>
  </nav>
</div>

<div class="toast" id="toast">Info</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WORLD = { w: 2100, h: 1250 };
const SAVE_KEY = "hydro_war_rts_pro_v2";

const baseMaxHp = 1500;

const unitStats = {
  soldier:{
    name:"Pasukan",
    icon:"🧍",
    hp:80,
    dmg:9,
    range:80,
    speed:105,
    cd:.7,
    money:70,
    energy:1,
    pop:1,
    size:28
  },
  tank:{
    name:"Tank Sci-Fi",
    icon:"🚙",
    hp:230,
    dmg:26,
    range:120,
    speed:58,
    cd:1.05,
    money:180,
    energy:2,
    pop:2,
    size:34
  },
  drone:{
    name:"Drone",
    icon:"🛰️",
    hp:95,
    dmg:15,
    range:135,
    speed:135,
    cd:.6,
    money:130,
    energy:2,
    pop:1,
    size:29
  },
  artillery:{
    name:"Artileri Fiksi",
    icon:"🎯",
    hp:130,
    dmg:48,
    range:250,
    speed:42,
    cd:1.65,
    money:270,
    energy:3,
    pop:3,
    size:32
  },
  enemyScout:{
    name:"Scout Musuh",
    icon:"👾",
    hp:85,
    dmg:9,
    range:82,
    speed:85,
    cd:.75,
    size:28
  },
  enemyTank:{
    name:"Robot Berat",
    icon:"🤖",
    hp:200,
    dmg:23,
    range:115,
    speed:52,
    cd:1.05,
    size:34
  },
  enemyBoss:{
    name:"Boss Walker",
    icon:"👹",
    hp:420,
    dmg:42,
    range:145,
    speed:38,
    cd:1.3,
    size:42
  }
};

let state = loadState() || {
  money:520,
  tech:1,
  energyCap:14,
  popCap:22,
  playerBaseHp:1500,
  enemyBaseHp:1650,
  enemyBaseMaxHp:1650,
  zone:1
};

let camera = { x:0, y:0, zoom:1 };
let units = [];
let enemies = [];
let projectiles = [];
let effects = [];
let selectedIds = [];
let idSeq = 1;
let lastTime = performance.now();
let enemyTimer = 0;
let incomeTimer = 0;

const playerBase = { x:190, y:860, w:170, h:140 };
const enemyBase = { x:1680, y:210, w:180, h:150 };

const decor = [];
for(let i=0;i<105;i++){
  decor.push({
    type: Math.random()<.66 ? "tree" : Math.random()<.8 ? "rock" : "crystal",
    x:70 + Math.random()*(WORLD.w-140),
    y:80 + Math.random()*(WORLD.h-160),
    s:9 + Math.random()*20
  });
}

function resize(){
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.max(1, Math.floor(r.width * dpr));
  canvas.height = Math.max(1, Math.floor(r.height * dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas._w = r.width;
  canvas._h = r.height;
  camera.zoom = Math.max(.52, Math.min(1.05, r.width / 980));
  clampCamera();
}
window.addEventListener("resize", resize);

function clampCamera(){
  const vw = canvas._w / camera.zoom;
  const vh = canvas._h / camera.zoom;
  camera.x = Math.max(0, Math.min(WORLD.w - vw, camera.x));
  camera.y = Math.max(0, Math.min(WORLD.h - vh, camera.y));
}

function $(id){return document.getElementById(id)}
function num(v){return Math.floor(v).toLocaleString("id-ID")}

function toast(text){
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(()=>t.classList.remove("show"),1600);
}

function log(text){
  const box = $("log");
  if(!box) return;
  const div = document.createElement("div");
  div.textContent = "• " + text;
  box.prepend(div);
  while(box.children.length>45) box.removeChild(box.lastChild);
}

function usedEnergy(){
  return units.reduce((a,u)=>a+(unitStats[u.type].energy||0),0);
}

function usedPop(){
  return units.reduce((a,u)=>a+(unitStats[u.type].pop||0),0);
}

function updateUI(){
  $("money").textContent = num(state.money);
  $("energy").textContent = usedEnergy()+"/"+state.energyCap;
  $("pop").textContent = usedPop()+"/"+state.popCap;
  $("tech").textContent = state.tech;
  $("zone").textContent = state.zone;

  $("baseHpText").textContent = num(Math.max(0,state.playerBaseHp));
  $("enemyHpText").textContent = num(Math.max(0,state.enemyBaseHp));
  $("baseHpBar").style.width = Math.max(0,state.playerBaseHp/baseMaxHp*100)+"%";
  $("enemyHpBar").style.width = Math.max(0,state.enemyBaseHp/state.enemyBaseMaxHp*100)+"%";
}

function makeUnit(type, team, x, y){
  const s = unitStats[type];
  return {
    id:idSeq++,
    type,
    team,
    x,y,
    hp:s.hp + (team==="player" ? state.tech*6 : state.zone*5),
    maxHp:s.hp + (team==="player" ? state.tech*6 : state.zone*5),
    dest:null,
    targetId:null,
    targetBase:null,
    cd:0,
    angle:0
  };
}

function buildUnit(type){
  const s = unitStats[type];
  if(state.money < s.money){toast("Uang kurang");return}
  if(usedEnergy()+s.energy > state.energyCap){toast("Energi tidak cukup");return}
  if(usedPop()+s.pop > state.popCap){toast("Populasi penuh");return}

  state.money -= s.money;

  const u = makeUnit(
    type,
    "player",
    playerBase.x + playerBase.w + 52 + Math.random()*45,
    playerBase.y + playerBase.h/2 + (Math.random()-.5)*95
  );

  units.push(u);
  selectedIds = [u.id];

  toast(s.name+" dibuat");
  log(s.name+" keluar dari pabrik markas.");
  updateUI();
}

function spawnEnemy(){
  let type = "enemyScout";
  const bossChance = state.zone % 5 === 0 && Math.random()<.18;
  if(bossChance) type = "enemyBoss";
  else if(Math.random() < Math.min(.48, state.zone*.055)) type = "enemyTank";

  const e = makeUnit(
    type,
    "enemy",
    enemyBase.x - 55 - Math.random()*65,
    enemyBase.y + enemyBase.h/2 + (Math.random()-.5)*120
  );
  e.targetBase = "player";
  enemies.push(e);

  if(type==="enemyBoss") log("Boss musuh muncul dari markas lawan!");
}

function selectAll(){
  selectedIds = units.map(u=>u.id);
  toast("Semua unit dipilih");
}

function attackEnemyBase(){
  if(units.length===0){toast("Belum ada unit");return}
  selectedIds = units.map(u=>u.id);
  for(const u of units){
    u.targetBase = "enemy";
    u.targetId = null;
    u.dest = null;
  }
  toast("Serang markas musuh!");
  log("Semua unit bergerak menuju wilayah musuh.");
}

function upgradeTech(){
  const cost = 420 + state.tech*260;
  if(state.money < cost){toast("Butuh uang "+cost);return}
  state.money -= cost;
  state.tech++;
  state.energyCap += 3;
  state.popCap += 4;
  toast("Teknologi naik Lv "+state.tech);
  log("Teknologi markas naik level "+state.tech+".");
  updateUI();
}

function repairBase(){
  const cost = 180 + state.tech*45;
  if(state.money < cost){toast("Uang kurang");return}
  state.money -= cost;
  state.playerBaseHp = Math.min(baseMaxHp, state.playerBaseHp + 330 + state.tech*35);
  toast("Markas diperbaiki");
  log("Teknisi memperbaiki markas.");
  updateUI();
}

function centerCamera(where){
  const b = where==="enemy" ? enemyBase : playerBase;
  camera.x = b.x - canvas._w/camera.zoom/2 + b.w/2;
  camera.y = b.y - canvas._h/camera.zoom/2 + b.h/2;
  clampCamera();
}

function dist(a,b){
  const dx=a.x-b.x, dy=a.y-b.y;
  return Math.sqrt(dx*dx+dy*dy);
}

function baseCenter(b){
  return {x:b.x+b.w/2,y:b.y+b.h/2};
}

function moveToward(u,target,dt){
  const dx=target.x-u.x, dy=target.y-u.y;
  const d=Math.sqrt(dx*dx+dy*dy);
  if(d<4) return true;
  const sp=unitStats[u.type].speed;
  u.x += dx/d*sp*dt;
  u.y += dy/d*sp*dt;
  u.angle = Math.atan2(dy,dx);
  return false;
}

function nearestTarget(u,list,range){
  let best=null, bestD=999999;
  for(const t of list){
    const d=dist(u,t);
    if(d<bestD && d<=range){
      best=t; bestD=d;
    }
  }
  return best;
}

function fire(attacker,target){
  const s=unitStats[attacker.type];
  if(attacker.cd>0) return;
  attacker.cd=s.cd;
  const dmg = s.dmg + (attacker.team==="player" ? state.tech*2 : state.zone*1.4);
  target.hp -= dmg;

  projectiles.push({
    x:attacker.x,
    y:attacker.y,
    tx:target.x,
    ty:target.y,
    life:.2,
    max:.2,
    team:attacker.team
  });

  if(target.hp<=0){
    effects.push({x:target.x,y:target.y,r:5,life:.45,max:.45});
  }
}

function fireBase(attacker,which){
  const s=unitStats[attacker.type];
  if(attacker.cd>0) return;
  attacker.cd=s.cd;

  const target = which==="enemy" ? baseCenter(enemyBase) : baseCenter(playerBase);
  const dmg = s.dmg + (attacker.team==="player" ? state.tech*2 : state.zone*1.6);

  projectiles.push({
    x:attacker.x,
    y:attacker.y,
    tx:target.x,
    ty:target.y,
    life:.2,
    max:.2,
    team:attacker.team
  });

  effects.push({x:target.x+(Math.random()-.5)*60,y:target.y+(Math.random()-.5)*55,r:4,life:.32,max:.32});

  if(which==="enemy"){
    state.enemyBaseHp -= dmg;
    if(state.enemyBaseHp<=0) winZone();
  }else{
    state.playerBaseHp -= dmg;
    if(state.playerBaseHp<=0) loseBase();
  }
}

function winZone(){
  toast("Wilayah musuh direbut!");
  log("Markas musuh hancur. Kamu merebut wilayah baru.");

  state.zone++;
  state.money += 700 + state.zone*160;
  state.energyCap += 2;
  state.popCap += 3;
  state.enemyBaseMaxHp = 1650 + state.zone*520;
  state.enemyBaseHp = state.enemyBaseMaxHp;
  state.playerBaseHp = Math.min(baseMaxHp,state.playerBaseHp+360);

  enemies=[];
  projectiles=[];
  effects.push({x:enemyBase.x+enemyBase.w/2,y:enemyBase.y+enemyBase.h/2,r:25,life:.8,max:.8});
  centerCamera("home");
  saveGame(false);
}

function loseBase(){
  toast("Markas rusak berat!");
  log("Markas kamu hancur sebagian. Sistem memulihkan darurat.");

  state.playerBaseHp=620;
  state.money=Math.max(120,state.money-420);
  units=[];
  enemies=[];
  selectedIds=[];
  projectiles=[];
}

function update(dt){
  incomeTimer += dt;
  enemyTimer += dt;

  if(incomeTimer>=1){
    incomeTimer=0;
    state.money += 14 + state.tech*3 + state.zone*2;
  }

  const enemyDelay = Math.max(2.9, 7.2 - state.zone*.24);
  if(enemyTimer>=enemyDelay){
    enemyTimer=0;
    spawnEnemy();
  }

  for(const u of units){
    const s=unitStats[u.type];
    u.cd=Math.max(0,u.cd-dt);

    let target=null;
    if(u.targetId){
      target=enemies.find(e=>e.id===u.targetId);
      if(!target) u.targetId=null;
    }

    if(!target) target=nearestTarget(u,enemies,s.range+45);

    if(target){
      if(dist(u,target)<=s.range) fire(u,target);
      else moveToward(u,target,dt);
      continue;
    }

    if(u.targetBase==="enemy"){
      const c=baseCenter(enemyBase);
      if(dist(u,c)<=s.range+35) fireBase(u,"enemy");
      else moveToward(u,c,dt);
      continue;
    }

    if(u.dest){
      if(moveToward(u,u.dest,dt)) u.dest=null;
    }
  }

  for(const e of enemies){
    const s=unitStats[e.type];
    e.cd=Math.max(0,e.cd-dt);

    let target=nearestTarget(e,units,s.range+45);

    if(target){
      if(dist(e,target)<=s.range) fire(e,target);
      else moveToward(e,target,dt);
      continue;
    }

    const c=baseCenter(playerBase);
    if(dist(e,c)<=s.range+35) fireBase(e,"player");
    else moveToward(e,c,dt);
  }

  units=units.filter(u=>u.hp>0);
  enemies=enemies.filter(e=>e.hp>0);
  selectedIds=selectedIds.filter(id=>units.some(u=>u.id===id));

  for(const p of projectiles) p.life-=dt;
  projectiles=projectiles.filter(p=>p.life>0);

  for(const e of effects){
    e.life-=dt;
    e.r += 110*dt;
  }
  effects=effects.filter(e=>e.life>0);

  updateUI();
}

function draw(){
  const w=canvas._w,h=canvas._h;
  ctx.clearRect(0,0,w,h);

  ctx.save();
  ctx.scale(camera.zoom,camera.zoom);
  ctx.translate(-camera.x,-camera.y);

  drawTerrain();
  drawBases();
  drawUnits();
  drawProjectiles();
  drawEffects();

  ctx.restore();

  drawMinimap();
  drawSelectionHelp();
}

function drawTerrain(){
  ctx.fillStyle="#183b21";
  ctx.fillRect(0,0,WORLD.w,WORLD.h);

  for(let y=0;y<WORLD.h;y+=80){
    for(let x=0;x<WORLD.w;x+=80){
      const shade=((x+y)/80)%2===0 ? "rgba(255,255,255,.025)" : "rgba(0,0,0,.04)";
      ctx.fillStyle=shade;
      ctx.fillRect(x,y,80,80);
    }
  }

  ctx.strokeStyle="rgba(255,255,255,.055)";
  ctx.lineWidth=1;
  for(let x=0;x<WORLD.w;x+=80){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD.h);ctx.stroke();
  }
  for(let y=0;y<WORLD.h;y+=80){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD.w,y);ctx.stroke();
  }

  ctx.strokeStyle="rgba(163,112,58,.48)";
  ctx.lineWidth=56;
  ctx.beginPath();
  ctx.moveTo(playerBase.x+120,playerBase.y+60);
  ctx.bezierCurveTo(570,790,1040,520,enemyBase.x+60,enemyBase.y+90);
  ctx.stroke();

  ctx.fillStyle="rgba(53,246,255,.08)";
  ctx.fillRect(0,0,WORLD.w/2,WORLD.h);
  ctx.fillStyle="rgba(255,61,100,.08)";
  ctx.fillRect(WORLD.w/2,0,WORLD.w/2,WORLD.h);

  for(const d of decor){
    if(d.type==="tree"){
      ctx.fillStyle="#0b2512";
      ctx.beginPath();ctx.arc(d.x,d.y,d.s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#1d7031";
      ctx.beginPath();ctx.arc(d.x,d.y-5,d.s*.68,0,Math.PI*2);ctx.fill();
    }else if(d.type==="rock"){
      ctx.fillStyle="#443a2d";
      ctx.beginPath();ctx.ellipse(d.x,d.y,d.s*1.1,d.s*.7,.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#8b7650";
      ctx.beginPath();ctx.ellipse(d.x-4,d.y-3,d.s*.5,d.s*.32,.2,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle="rgba(53,246,255,.55)";
      ctx.beginPath();
      ctx.moveTo(d.x,d.y-d.s);
      ctx.lineTo(d.x+d.s*.6,d.y);
      ctx.lineTo(d.x,d.y+d.s);
      ctx.lineTo(d.x-d.s*.6,d.y);
      ctx.closePath();
      ctx.fill();
    }
  }

  ctx.fillStyle="rgba(255,255,255,.58)";
  ctx.font="bold 26px Arial";
  ctx.textAlign="left";
  ctx.fillText("WILAYAH KAMU",80,85);
  ctx.fillText("WILAYAH MUSUH",WORLD.w-365,85);
}

function drawBases(){
  drawBase(playerBase,"#14618e","🏰","HQ Kamu",state.playerBaseHp,baseMaxHp,false);
  drawBase(enemyBase,"#86223b","👹","HQ Musuh",state.enemyBaseHp,state.enemyBaseMaxHp,true);

  drawSmallBuilding(240,700,"🏭","Factory",false);
  drawSmallBuilding(110,760,"⚡","Hydro",false);
  drawSmallBuilding(395,900,"🧪","Lab",false);

  drawSmallBuilding(1510,365,"🏭","War Plant",true);
  drawSmallBuilding(1710,430,"📡","Radar",true);
  drawSmallBuilding(1400,190,"🧬","Core",true);
}

function drawBase(b,color,emoji,label,hp,maxHp,enemy){
  ctx.save();
  ctx.fillStyle=color;
  roundRect(b.x,b.y,b.w,b.h,24);
  ctx.fill();

  ctx.strokeStyle=enemy ? "rgba(255,61,100,.75)" : "rgba(53,246,255,.75)";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.shadowColor=enemy ? "#ff3d64" : "#35f6ff";
  ctx.shadowBlur=22;
  ctx.font="52px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(emoji,b.x+b.w/2,b.y+b.h/2-12);
  ctx.shadowBlur=0;

  ctx.fillStyle="#fff";
  ctx.font="bold 15px Arial";
  ctx.fillText(label,b.x+b.w/2,b.y+b.h-26);

  ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.fillRect(b.x+16,b.y+12,b.w-32,10);
  ctx.fillStyle=enemy ? "#ff3d64" : "#35f6ff";
  ctx.fillRect(b.x+16,b.y+12,(b.w-32)*Math.max(0,hp/maxHp),10);
  ctx.restore();
}

function drawSmallBuilding(x,y,emoji,label,enemy){
  ctx.save();
  ctx.fillStyle=enemy ? "#4d1626" : "#123e5b";
  roundRect(x,y,105,76,18);
  ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.18)";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.font="30px Arial";
  ctx.textAlign="center";
  ctx.fillText(emoji,x+52,y+36);
  ctx.fillStyle="#eaf7ff";
  ctx.font="12px Arial";
  ctx.fillText(label,x+52,y+62);
  ctx.restore();
}

function drawUnits(){
  for(const e of enemies) drawUnit(e);
  for(const u of units) drawUnit(u);
}

function drawUnit(u){
  const s=unitStats[u.type];
  const selected=selectedIds.includes(u.id);

  ctx.save();
  ctx.translate(u.x,u.y);

  if(selected){
    ctx.strokeStyle="#fff26b";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(0,0,s.size+11,0,Math.PI*2);
    ctx.stroke();
  }

  ctx.rotate(u.angle || 0);

  const isPlayer=u.team==="player";
  ctx.fillStyle=isPlayer ? "rgba(21,83,132,.95)" : "rgba(122,29,48,.95)";
  ctx.strokeStyle=isPlayer ? "#35f6ff" : "#ff3d64";
  ctx.lineWidth=2;

  roundRect(-s.size*.72,-s.size*.72,s.size*1.44,s.size*1.44,13);
  ctx.fill();
  ctx.stroke();

  ctx.rotate(-(u.angle || 0));
  ctx.font=s.size+"px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(s.icon,0,0);

  ctx.fillStyle="rgba(0,0,0,.65)";
  ctx.fillRect(-s.size,-s.size-12,s.size*2,6);
  ctx.fillStyle=isPlayer ? "#19ff9a" : "#ffd166";
  ctx.fillRect(-s.size,-s.size-12,s.size*2*Math.max(0,u.hp/u.maxHp),6);

  ctx.restore();
}

function drawProjectiles(){
  for(const p of projectiles){
    const alpha=p.life/p.max;
    ctx.globalAlpha=alpha;
    ctx.strokeStyle=p.team==="player" ? "#35f6ff" : "#ff3d64";
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.tx,p.ty);
    ctx.stroke();
    ctx.globalAlpha=1;
  }
}

function drawEffects(){
  for(const e of effects){
    const a=e.life/e.max;
    ctx.globalAlpha=a;
    ctx.fillStyle="rgba(255,209,102,.55)";
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="rgba(255,61,100,.9)";
    ctx.lineWidth=3;
    ctx.stroke();
    ctx.globalAlpha=1;
  }
}

function drawMinimap(){
  const w=170,h=102,x=12,y=12;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.58)";
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle="rgba(53,246,255,.75)";
  ctx.lineWidth=1;
  ctx.strokeRect(x,y,w,h);

  function mx(wx){return x+wx/WORLD.w*w}
  function my(wy){return y+wy/WORLD.h*h}

  ctx.fillStyle="#35f6ff";
  ctx.fillRect(mx(playerBase.x),my(playerBase.y),11,8);
  ctx.fillStyle="#ff3d64";
  ctx.fillRect(mx(enemyBase.x),my(enemyBase.y),11,8);

  ctx.fillStyle="#aefcff";
  for(const u of units) ctx.fillRect(mx(u.x),my(u.y),3,3);
  ctx.fillStyle="#ff9b2f";
  for(const e of enemies) ctx.fillRect(mx(e.x),my(e.y),3,3);

  const vw=canvas._w/camera.zoom;
  const vh=canvas._h/camera.zoom;
  ctx.strokeStyle="#fff";
  ctx.strokeRect(mx(camera.x),my(camera.y),vw/WORLD.w*w,vh/WORLD.h*h);

  ctx.fillStyle="rgba(255,255,255,.75)";
  ctx.font="10px Arial";
  ctx.fillText("MINIMAP",x+8,y+h-7);
  ctx.restore();
}

function drawSelectionHelp(){
  if(selectedIds.length){
    ctx.save();
    ctx.fillStyle="rgba(4,8,20,.72)";
    ctx.strokeStyle="rgba(53,246,255,.3)";
    roundRect(12,canvas._h-52,230,38,14);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle="#eaf7ff";
    ctx.font="12px Arial";
    ctx.fillText(selectedIds.length+" unit dipilih • tap tanah untuk bergerak",24,canvas._h-29);
    ctx.restore();
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function screenToWorld(sx,sy){
  return {x:sx/camera.zoom+camera.x,y:sy/camera.zoom+camera.y};
}

function findUnitAt(pos){
  for(let i=units.length-1;i>=0;i--){
    if(dist(units[i],pos)<unitStats[units[i].type].size+14) return units[i];
  }
  for(let i=enemies.length-1;i>=0;i--){
    if(dist(enemies[i],pos)<unitStats[enemies[i].type].size+14) return enemies[i];
  }
  return null;
}

function pointInBase(pos,b){
  return pos.x>=b.x && pos.x<=b.x+b.w && pos.y>=b.y && pos.y<=b.y+b.h;
}

let pointer={down:false,startX:0,startY:0,lastX:0,lastY:0,moved:false};

canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId);
  pointer.down=true;
  pointer.startX=e.offsetX;
  pointer.startY=e.offsetY;
  pointer.lastX=e.offsetX;
  pointer.lastY=e.offsetY;
  pointer.moved=false;
});

canvas.addEventListener("pointermove",e=>{
  if(!pointer.down) return;
  const dx=e.offsetX-pointer.lastX;
  const dy=e.offsetY-pointer.lastY;
  const total=Math.hypot(e.offsetX-pointer.startX,e.offsetY-pointer.startY);

  if(total>8){
    pointer.moved=true;
    camera.x-=dx/camera.zoom;
    camera.y-=dy/camera.zoom;
    clampCamera();
  }

  pointer.lastX=e.offsetX;
  pointer.lastY=e.offsetY;
});

canvas.addEventListener("pointerup",e=>{
  pointer.down=false;
  if(pointer.moved) return;
  const pos=screenToWorld(e.offsetX,e.offsetY);
  handleTap(pos);
});

function handleTap(pos){
  const hit=findUnitAt(pos);

  if(hit){
    if(hit.team==="player"){
      if(selectedIds.includes(hit.id)){
        selectedIds=selectedIds.filter(id=>id!==hit.id);
      }else{
        selectedIds=[hit.id];
      }
      return;
    }else{
      if(selectedIds.length){
        for(const id of selectedIds){
          const u=units.find(x=>x.id===id);
          if(u){
            u.targetId=hit.id;
            u.targetBase=null;
            u.dest=null;
          }
        }
        toast("Target musuh dikunci");
      }
      return;
    }
  }

  if(pointInBase(pos,enemyBase) && selectedIds.length){
    for(const id of selectedIds){
      const u=units.find(x=>x.id===id);
      if(u){
        u.targetBase="enemy";
        u.targetId=null;
        u.dest=null;
      }
    }
    toast("Unit menyerang markas musuh");
    return;
  }

  if(selectedIds.length){
    for(const id of selectedIds){
      const u=units.find(x=>x.id===id);
      if(u){
        u.dest={x:pos.x+(Math.random()-.5)*50,y:pos.y+(Math.random()-.5)*50};
        u.targetId=null;
        u.targetBase=null;
      }
    }
    toast("Unit bergerak");
  }
}

function saveGame(show){
  localStorage.setItem(SAVE_KEY,JSON.stringify(state));
  if(show) toast("Game disimpan");
}

function loadState(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    return raw?JSON.parse(raw):null;
  }catch(e){return null}
}

function resetGame(){
  if(!confirm("Reset game dari awal?")) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

function loop(now){
  const dt=Math.min(.05,(now-lastTime)/1000);
  lastTime=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

setInterval(()=>saveGame(false),5000);

resize();
centerCamera("home");
updateUI();
log("HYDRO WAR RTS Pro aktif. Buat unit, pilih, lalu serang wilayah musuh.");
requestAnimationFrame(loop);
</script>
</body>
